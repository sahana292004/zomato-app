# ═══════════════════════════════════════
#  Zomato — Application Configuration
# ═══════════════════════════════════════

server.port=${PORT:8080}

# ── Database Configuration ──
# Defaults to H2 in-memory database, but can be overridden with environment variables (e.g. for MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:zomato_app;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# ── Schema Initialization ──
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# ── Session ──
server.servlet.session.timeout=24h
server.servlet.session.cookie.http-only=true

# ── Jackson JSON ──
spring.jackson.default-property-inclusion=non_null
